name: CD

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:

  k8s:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        shell: bash
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_USERNAME: ${{ secrets.KUBE_USERNAME }}
          TTL_SECONDS_AFTER_FINISHED: ${{ vars.TTL_SECONDS_AFTER_FINISHED }}
          MLXP_ZONE: ${{ secrets.MLXP_ZONE }}
          CPU_REQUEST: ${{ vars.CPU_REQUEST }}
          GPU_REQUEST: ${{ vars.GPU_REQUEST }}
        run: |
          job_name="gpytorch_qr-${GIT_SHA::7}-${{ github.event_name }}-${RUN_ID}-${RUN_ATTEMPT}"
          export JOB_NAME="$job_name"
          template_vars="$(grep -oE '\$\{[A-Z_][A-Z0-9_]*\}' .github/k8s/job.yaml | sort -u | tr '\n' ' ')"
          envsubst "$template_vars" < .github/k8s/job.yaml | kubectl apply -f -
          kubectl wait \
            --namespace="$KUBE_NAMESPACE" \
            --for=create \
            "pod" \
            --selector="job-name=${job_name}" \
            --timeout=120s

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: check out repository
        uses: actions/checkout@v4

      - name: verify release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_VERSION#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag version ($tag_version) does not match pyproject.toml version ($project_version)."
            exit 1
          fi

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          changelog_version="${TAG_VERSION#v}"
          notes="$(python .github/scripts/parse-changelog.py "$changelog_version")"
          gh release create "$TAG_VERSION" --title "$TAG_VERSION" --notes "$notes"

  publish:

    runs-on: ubuntu-latest
  
    needs: release

    if: needs.release.result == 'success'
  
    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: build package
        run: |
          pip install build
          python -m build

      - name: publish to PyPI
        run: |
          pip install twine
          pip install -U packaging
          twine upload dist/* -u __token__ -p ${{ secrets.pypi_token }}
