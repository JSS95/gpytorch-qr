name: CD

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Create GitHub App token for checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Create checks
        id: checks
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'k8s',
              head_sha: context.payload.pull_request?.head?.sha ?? context.sha,
              status: 'in_progress',
            });
            core.setOutput('k8s-check-run-id', String(check.id));

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create GitHub app secret
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          if [ -z "$GH_APP_ID" ]; then
            echo "::error::Missing GH_APP_ID secret for GitHub check runs and documentation branch pushes."
            exit 1
          fi
          if [ -z "$GH_APP_PRIVATE_KEY" ]; then
            echo "::error::Missing GH_APP_PRIVATE_KEY secret for GitHub check runs and documentation branch pushes."
            exit 1
          fi

          kubectl create secret generic github-app \
            --from-literal=GH_APP_ID="$GH_APP_ID" \
            --from-literal=GH_APP_PRIVATE_KEY="$GH_APP_PRIVATE_KEY" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        id: deploy-to-kubernetes
        shell: bash
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_CHECK_RUN_ID: ${{ steps.checks.outputs.k8s-check-run-id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_USERNAME: ${{ secrets.KUBE_USERNAME }}
          TTL_SECONDS_AFTER_FINISHED: ${{ vars.TTL_SECONDS_AFTER_FINISHED }}
          MLXP_ZONE: ${{ secrets.MLXP_ZONE }}
          CPU_REQUEST: ${{ vars.CPU_REQUEST }}
          GPU_REQUEST: ${{ vars.GPU_REQUEST }}
        run: |
          event_name="${{ github.event_name }}"
          job_name="gpytorch-qr.${GIT_SHA::7}-${event_name//_/}.${RUN_ID}-${RUN_ATTEMPT}"
          export JOB_NAME="$job_name"
          template_vars="$(grep -oE '\$\{[A-Z_][A-Z0-9_]*\}' .github/k8s/job.yaml | sort -u | tr '\n' ' ')"
          envsubst "$template_vars" < .github/k8s/job.yaml | kubectl apply -f -
          kubectl wait \
            --namespace="$KUBE_NAMESPACE" \
            --for=create \
            "pod" \
            --selector="job-name=${job_name}" \
            --timeout=120s

      - name: Mark k8s check as failed
        if: failure() && steps.deploy-to-kubernetes.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.checks.outputs.k8s-check-run-id }}'),
              status: 'completed',
              conclusion: 'failure',
            });

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: check out repository
        uses: actions/checkout@v4

      - name: verify release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_VERSION#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag version ($tag_version) does not match pyproject.toml version ($project_version)."
            exit 1
          fi

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          changelog_version="${TAG_VERSION#v}"
          notes="$(python .github/scripts/parse-changelog.py "$changelog_version")"
          gh release create "$TAG_VERSION" --title "$TAG_VERSION" --notes "$notes"

  publish:

    runs-on: ubuntu-latest
  
    needs: release

    if: needs.release.result == 'success'
  
    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: build package
        run: |
          pip install build
          python -m build

      - name: publish to PyPI
        run: |
          pip install twine
          pip install -U packaging
          twine upload dist/* -u __token__ -p ${{ secrets.pypi_token }}
