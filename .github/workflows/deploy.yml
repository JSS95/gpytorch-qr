name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      publish_doc_check_run_id:
        description: Check run to pass to the release documentation build.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  k8s:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token for checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Create checks
        id: checks
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'k8s',
              head_sha: context.payload.pull_request?.head?.sha ?? context.sha,
              status: 'queued',
              output: {
                title: 'Job is queued',
                summary: 'Waiting for the Kubernetes Job to start.',
              },
            });
            core.setOutput('k8s-check-run-id', String(check.id));

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create GitHub app secret
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          if [ -z "$GH_APP_ID" ]; then
            echo "::error::Missing GH_APP_ID secret for GitHub check runs and documentation branch pushes."
            exit 1
          fi
          if [ -z "$GH_APP_PRIVATE_KEY" ]; then
            echo "::error::Missing GH_APP_PRIVATE_KEY secret for GitHub check runs and documentation branch pushes."
            exit 1
          fi

          kubectl create secret generic gpytorch-qr-github-app \
            --from-literal=GH_APP_ID="$GH_APP_ID" \
            --from-literal=GH_APP_PRIVATE_KEY="$GH_APP_PRIVATE_KEY" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        id: deploy-to-kubernetes
        shell: bash
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_USERNAME: ${{ secrets.KUBE_USERNAME }}
          TTL_SECONDS_AFTER_FINISHED: ${{ vars.TTL_SECONDS_AFTER_FINISHED }}
          MLXP_ZONE: ${{ secrets.MLXP_ZONE }}
          CPU_REQUEST: ${{ vars.CPU_REQUEST }}
          GPU_REQUEST: ${{ vars.GPU_REQUEST }}
        run: |
          event_name="${{ github.event_name }}"
          job_name="gpytorch-qr.${GIT_SHA::7}-${event_name//_/}.${{ github.run_id }}-${{ github.run_attempt }}"
          github_config_map_name="${job_name}-github-config"
          export JOB_NAME="$job_name"
          export GITHUB_CONFIG_MAP_NAME="$github_config_map_name"

          kubectl create configmap "$github_config_map_name" \
            --from-literal=GITHUB_REPOSITORY="${{ github.repository }}" \
            --from-literal=GITHUB_EVENT_NAME="${{ github.event_name }}" \
            --from-literal=GITHUB_REF_NAME="${{ github.ref_name }}" \
            --from-literal=GITHUB_RELEASE_ID="${{ github.event.release.id }}" \
            --from-literal=GITHUB_RELEASE_TAG_NAME="${{ github.event.release.tag_name }}" \
            --from-literal=GITHUB_CHECK_RUN_ID="${{ steps.checks.outputs.k8s-check-run-id }}" \
            --from-literal=PUBLISH_DOC_CHECK_RUN_ID="${{ inputs.publish_doc_check_run_id }}" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          template_vars="$(grep -oE '\$\{[A-Z_][A-Z0-9_]*\}' .github/k8s/job.yaml | sort -u | tr '\n' ' ')"
          envsubst "$template_vars" < .github/k8s/job.yaml | kubectl apply -f -

          job_uid="$(kubectl get job "$job_name" --namespace="$KUBE_NAMESPACE" -o jsonpath='{.metadata.uid}')"
          kubectl patch configmap "$github_config_map_name" \
            --namespace="$KUBE_NAMESPACE" \
            --type=merge \
            --patch="{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"batch/v1\",\"kind\":\"Job\",\"name\":\"${job_name}\",\"uid\":\"${job_uid}\"}]}}"

          kubectl wait \
            --namespace="$KUBE_NAMESPACE" \
            --for=create \
            "pod" \
            --selector="job-name=${job_name}" \
            --timeout=120s

      - name: Mark k8s check as failed
        if: failure() && steps.deploy-to-kubernetes.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.checks.outputs.k8s-check-run-id }}'),
              status: 'completed',
              conclusion: 'failure',
            });
