name: Publish documentation

on:
  repository_dispatch:
    types: [build-release-docs]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark publish doc check as in progress
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
        run: bash -euo pipefail .github/scripts/check-run.sh in_progress "" "Read the Docs build has started"

      - name: Trigger Read the Docs build
        id: trigger-read-the-docs
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        run: |
          if [ -z "$READTHEDOCS_TOKEN" ]; then
            echo "::error::Missing READTHEDOCS_TOKEN secret."
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Missing release_tag repository dispatch payload."
            exit 1
          fi

          encoded_tag="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$RELEASE_TAG")"
          project_url="https://app.readthedocs.org/api/v3/projects/gpytorch-qr"

          curl --fail --silent --show-error --request POST \
            --header "Authorization: Token $READTHEDOCS_TOKEN" \
            "$project_url/sync-versions/"

          version_url="$project_url/versions/${encoded_tag}/"
          for attempt in {1..30}; do
            version_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Token $READTHEDOCS_TOKEN" \
              "$version_url")"
            if [ "$version_status" = 200 ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::Read the Docs version '$RELEASE_TAG' was not created after syncing."
              exit 1
            fi
            sleep 2
          done

          build_response="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Token $READTHEDOCS_TOKEN" \
            "$version_url/builds/")"
          build_id="$(python -c '
          import json
          import re
          import sys

          build = json.load(sys.stdin)["build"]
          if isinstance(build, dict):
              print(build["id"])
          elif isinstance(build, int):
              print(build)
          else:
              matches = re.findall(r"\d+", str(build))
              if not matches:
                  raise SystemExit("Read the Docs response did not contain a build ID")
              print(matches[-1])
          ' <<<"$build_response")"
          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Monitor Read the Docs build
        id: monitor-read-the-docs
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          BUILD_ID: ${{ steps.trigger-read-the-docs.outputs.build-id }}
        run: |
          build_url="https://app.readthedocs.org/api/v3/projects/gpytorch-qr/builds/${BUILD_ID}/"
          for attempt in {1..360}; do
            build_response="$(curl --fail --silent --show-error \
              --header "Authorization: Token $READTHEDOCS_TOKEN" \
              "$build_url")"
            build_result="$(python -c '
          import json
          import sys

          build = json.load(sys.stdin)
          state = build.get("state") or {}
          state = state.get("code") if isinstance(state, dict) else state
          if state == "finished":
              print("success" if build.get("success") else "failure")
          elif state == "cancelled":
              print("failure")
          else:
              print("running")
          ' <<<"$build_response")"
            case "$build_result" in
              success) exit 0 ;;
              failure)
                echo "::error::Read the Docs build $BUILD_ID failed."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Read the Docs build $BUILD_ID."
          exit 1

      - name: Mark publish doc check as failed
        if: failure() && (steps.trigger-read-the-docs.outcome == 'failure' || steps.monitor-read-the-docs.outcome == 'failure')
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
        run: bash -euo pipefail .github/scripts/check-run.sh completed failure "Read the Docs build failed"
