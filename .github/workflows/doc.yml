name: Publish documentation

on:
  repository_dispatch:
    types: [build-release-docs]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish documentation for
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.client_payload.release_tag }}

      - name: Mark publish doc check as in progress
        if: github.event_name == 'repository_dispatch'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
        run: bash -euo pipefail .github/scripts/check-run.sh in_progress "" "Read the Docs build has started"

      - name: Sync Read the Docs versions
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Token ${{ secrets.READTHEDOCS_TOKEN }}" \
            "https://app.readthedocs.org/api/v3/projects/gpytorch-qr/sync-versions/"

      - name: Wait for Read the Docs version to be created
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.client_payload.release_tag }}
        run: |
            for i in {1..30}; do
              RESPONSE=$(curl --fail-with-body -sS \
                -H "Authorization: Token $READTHEDOCS_TOKEN" \
                --get \
                --data-urlencode "verbose_name=$RELEASE_TAG" \
                --data-urlencode "type=tag" \
                "https://app.readthedocs.org/api/v3/projects/gpytorch-qr/versions/")

              SLUG=$(echo "$RESPONSE" | jq -r '.results[0].slug // empty')

              if [ -n "$SLUG" ]; then
                echo "RTD version created: $RELEASE_TAG -> $SLUG"
                break
              fi

              echo "Waiting for RTD version sync..."
              sleep 5
            done

            if [ -z "$SLUG" ]; then
              echo "RTD version was not created"
              exit 1
            fi

      - name: Trigger Read the Docs build
        id: trigger-read-the-docs
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.client_payload.release_tag }}
        run: |
          build_response="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Token $READTHEDOCS_TOKEN" \
            "https://app.readthedocs.org/api/v3/projects/gpytorch-qr/versions/${RELEASE_TAG}/builds/")"
          build_id="$(python -c '
          import json
          import re
          import sys

          build = json.load(sys.stdin)["build"]
          if isinstance(build, dict):
              print(build["id"])
          elif isinstance(build, int):
              print(build)
          else:
              matches = re.findall(r"\d+", str(build))
              if not matches:
                  raise SystemExit("Read the Docs response did not contain a build ID")
              print(matches[-1])
          ' <<<"$build_response")"
          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Monitor Read the Docs build
        id: monitor-read-the-docs
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          BUILD_ID: ${{ steps.trigger-read-the-docs.outputs.build-id }}
        run: |
          build_url="https://app.readthedocs.org/api/v3/projects/gpytorch-qr/builds/${BUILD_ID}/"
          for attempt in {1..360}; do
            build_response="$(curl --fail --silent --show-error \
              --header "Authorization: Token $READTHEDOCS_TOKEN" \
              "$build_url")"
            build_result="$(python -c '
          import json
          import sys

          build = json.load(sys.stdin)
          state = build.get("state") or {}
          state = state.get("code") if isinstance(state, dict) else state
          if state == "finished":
              print("success" if build.get("success") else "failure")
          elif state == "cancelled":
              print("failure")
          else:
              print("running")
          ' <<<"$build_response")"
            case "$build_result" in
              success) exit 0 ;;
              failure)
                echo "::error::Read the Docs build $BUILD_ID failed."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Read the Docs build $BUILD_ID."
          exit 1

      - name: Activate Read the Docs version
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.client_payload.release_tag }}
        run: |
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: Token $READTHEDOCS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"active": true, "hidden": false}' \
            "https://app.readthedocs.org/api/v3/projects/gpytorch-qr/versions/${RELEASE_TAG}/"

      - name: Mark publish doc check as successful
        if: success() && github.event_name == 'repository_dispatch'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
        run: bash -euo pipefail .github/scripts/check-run.sh completed success "Documentation published"

      - name: Mark publish doc check as failed
        if: failure() && github.event_name == 'repository_dispatch'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
        run: bash -euo pipefail .github/scripts/check-run.sh completed failure "Read the Docs build failed"
