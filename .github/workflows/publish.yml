name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  documentation-check:

    runs-on: ubuntu-latest
    outputs:
      check-run-id: ${{ steps.check.outputs.check-run-id }}

    steps:

      - name: Create GitHub App token for checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Create publish doc check
        id: check
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'publish doc',
              head_sha: context.sha,
              status: 'queued',
              output: {
                title: 'Documentation build is queued',
                summary: `- ${timestamp} — Waiting for the Kubernetes release job (status=queued)`,
              },
            });
            core.setOutput('check-run-id', String(check.id));

  deploy:

    needs: documentation-check
    uses: ./.github/workflows/deploy.yml
    with:
      publish_doc_check_run_id: ${{ needs.documentation-check.outputs.check-run-id }}
    secrets: inherit

  changelog:

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: update triggered GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.event.release.tag_name }}
        run: |
          changelog_version="${TAG_VERSION#v}"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          python .github/scripts/parse-changelog.py "$changelog_version" > "$notes_file"
          gh release edit "$TAG_VERSION" --notes-file "$notes_file"

  pypi:

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: build package
        run: |
          pip install build
          python -m build

      - name: publish to PyPI
        run: |
          pip install twine
          pip install -U packaging
          twine upload dist/* -u __token__ -p ${{ secrets.pypi_token }}
