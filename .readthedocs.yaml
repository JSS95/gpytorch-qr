version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "tag" ]; then
          release_tag="$READTHEDOCS_GIT_IDENTIFIER"
          archive_file="$(mktemp --suffix=.tar.gz)"
          trap 'rm -f "$archive_file"' 0
          curl --fail --location --silent --show-error \
            --output "$archive_file" \
            "https://github.com/JSS95/gpytorch-qr/releases/download/${release_tag}/examples-${release_tag}.tar.gz"
          tar -xzf "$archive_file" -C examples
        fi
    post_build:
      - GITHUB_REPOSITORY=JSS95/gpytorch-qr GIT_SHA="$READTHEDOCS_GIT_COMMIT_HASH" GITHUB_CHECK_RUN_NAME="publish doc" bash -euo pipefail .github/scripts/check-run.sh completed success "Documentation published"

sphinx:
  configuration: doc/source/conf.py

python:
  install:
    - path: .
      extra_requirements:
        - doc
